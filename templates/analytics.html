<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spending Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h1 {
            color: #222;
        }

        h2 {
            color: #333;
        }

        .total {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }

        .chart-container {
            max-width: 600px;
            margin: 30px auto;
        }

        .back-button {
            display: inline-block;
            padding: 12px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .back-button:hover {
            background: #0056b3;
        }
    </style>

</head>

<body>

    <div class="container">

        <a href="{{ url_for('dashboard') }}" class="back-button">
            ← Back to Dashboard
        </a>

        <div class="card">

            <h1>📊 Spending Analytics</h1>

            <p>Total Expenses</p>

            <div class="total">
                ₹{{ "%.2f"|format(total_expenses) }}
            </div>

        </div>


        <div class="card">

            <h2>💰 Spending by Category</h2>

            {% if category_totals %}

            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>

            {% else %}

            <p>No expenses recorded yet.</p>

            {% endif %}

        </div>

    </div>


    {% if category_totals %}

    <script>

        const categories = {{ category_totals.keys() | list | tojson }};

        const amounts = {{ category_totals.values() | list | tojson }};


        const ctx = document.getElementById("expenseChart");

        new Chart(ctx, {

            type: "doughnut",

            data: {

                labels: categories,

                datasets: [{
                    label: "Expenses",
                    data: amounts
                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {
                        position: "bottom"
                    }

                }

            }

        });

    </script>

    {% endif %}

</body>

</html>
